[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-tenant-gpu-scheduling"
version = "0.1.0"
description = "One GPU agreement between teams, enforced by Kueue or by KAI Scheduler (lab)"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
tenancy = "tenancy.cli:main"

[tool.setuptools]
packages = ["tenancy"]
